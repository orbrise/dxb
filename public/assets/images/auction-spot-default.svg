<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" preserveAspectRatio="xMidYMid slice">
  <!-- Default Top Spot auction image (App\Models\Auction::DEFAULT_IMAGE), used
       when an admin hasn't uploaded one. The card darkens it and centres the
       price, so the crown stays in the top strip, clear of the text. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="8%" r="85%">
      <stop offset="0" stop-color="#4a5e12"/>
      <stop offset="0.45" stop-color="#1b2608"/>
      <stop offset="1" stop-color="#0a0d0e"/>
    </radialGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1ffb0"/>
      <stop offset="1" stop-color="#C1F11D"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="1.3" fill="#C1F11D" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="600" height="500" fill="url(#glow)"/>
  <rect width="600" height="500" fill="url(#dots)"/>
  <g stroke="#C1F11D" stroke-opacity="0.1" stroke-width="2" stroke-linecap="round">
    <path d="M300 46 L20 500 M300 46 L160 500 M300 46 L300 500 M300 46 L440 500 M300 46 L580 500 M300 46 L-40 250 M300 46 L640 250"/>
  </g>
  <circle cx="300" cy="46" r="56" fill="none" stroke="#C1F11D" stroke-opacity="0.18" stroke-width="2"/>
  <circle cx="300" cy="46" r="84" fill="none" stroke="#C1F11D" stroke-opacity="0.08" stroke-width="2"/>
  <g transform="translate(268.5 18) scale(3.5)">
    <path d="M17.43 4.57 14.97 12.16H3.03L.56 4.57l4.87 2.74L9 .56l3.57 6.75 4.86-2.74Z" fill="url(#crown)"/>
    <path d="M3.36 14.67h11.28" stroke="#C1F11D" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
